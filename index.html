        <script id="tiny-performance-profile">
            /* Performance profile: animated background adapts, story timing/audio/product links stay unchanged. */
            window.TINY_PERF = (() => {
                const qs = new URLSearchParams(location.search);
                const quality = qs.get("tinyfx");
                const touch = matchMedia("(pointer:coarse)").matches;
                const constrained =
                    touch ||
                    (navigator.deviceMemory && navigator.deviceMemory <= 6) ||
                    (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
                const mobile =
                    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                    (touch &&
                        matchMedia("(max-width:900px)").matches &&
                        !/Windows|Macintosh|X11/i.test(navigator.userAgent));
                const lite = mobile || (quality === "full" ? false : quality === "lite" ? true : !!constrained);
                document.documentElement.classList.toggle("tiny-lite", lite);
                document.documentElement.classList.toggle("tiny-mobile", mobile);
                const maxCanvasPixels = mobile ? 365000 : lite ? 1250000 : 2100000;
                function canvasDpr(w, h, maxDpr = 1.6) {
                    return Math.max(
                        mobile ? 0.48 : 0.55,
                        Math.min(
                            devicePixelRatio || 1,
                            mobile ? 0.84 : lite ? 1.15 : maxDpr,
                            Math.sqrt(maxCanvasPixels / Math.max(1, w * h))
                        )
                    );
                }
                return {
                    lite,
                    mobile,
                    canvasDpr,
                    ambientFps: mobile ? 60 : lite ? 24 : 60,
                    roverFps: mobile ? 45 : lite ? 30 : 60,
                    orbitFps: mobile ? 45 : lite ? 24 : 60,
                    leafFps: mobile ? 60 : lite ? 24 : 60,
                };
            })();
        </script>

            body {

            /* Bầu trời sao (lớp nền, không che nhân vật và chữ) */
            #tiny-sky {
                position: absolute;
                inset: 0;
                z-index: 1;
                overflow: hidden;
                pointer-events: none;
                opacity: 0;
                visibility: hidden;
                transition:
                    opacity 1.6s ease-in-out,
                    visibility 1.6s;
            }
            #tiny-sky.hien-thi {
                opacity: 1;
                visibility: visible;
            }
            #tiny-sky:not(.hien-thi) .tiny-star,
            #tiny-sky:not(.hien-thi) .tiny-meteor {
                animation-play-state: paused;
            }
            .tiny-star {
                position: absolute;
                width: var(--size);
                height: var(--size);
                background: #fff;
                border-radius: 50%;
                box-shadow: 0 0 6px 1px rgba(220, 244, 255, 0.65);
                animation: tinyTwinkle var(--twinkle) ease-in-out var(--delay) infinite alternate;
            }
            @keyframes tinyTwinkle {
                from {
                    opacity: 0.18;
                    transform: scale(0.65);
                }
                to {
                    opacity: 0.95;
                    transform: scale(1.25);
                }
            }
            /* Sao băng: đuôi kéo về phía trên-phải, đầu sao lao chéo xuống-trái.
           Góc nghiêng được JS căn trùng với quỹ đạo thực tế ở từng màn hình. */
            .tiny-meteor {
                position: absolute;
                width: clamp(62px, 10vw, 135px);
                height: 2px;
                opacity: 0;
                background: linear-gradient(
                    to right,
                    rgba(255, 255, 255, 0.98) 0%,
                    rgba(198, 235, 255, 0.86) 13%,
                    rgba(130, 200, 255, 0.34) 52%,
                    rgba(130, 200, 255, 0) 100%
                );
                border-radius: 99px;
                box-shadow: 0 0 6px rgba(210, 240, 255, 0.7);
                transform-origin: 0 50%;
                transform: translate3d(0, 0, 0) rotate(var(--meteor-angle, -25deg));
                will-change: transform, opacity;
                animation: tinyMeteor var(--period) linear var(--meteor-delay) infinite;
            }
            .tiny-meteor::before {
                content: "";
                position: absolute;
                left: -3px;
                top: -2.5px;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #ffffff;
                box-shadow: 0 0 8px 2px rgba(230, 249, 255, 0.9);
            }
            /* Tất cả diễn ra đồng thời: nổi sáng -> lao dọc một đường thẳng -> chìm dần.
           Nửa sau chu kỳ ẩn để các sao băng không xuất hiện dồn dập. */
            @keyframes tinyMeteor {
                0% {
                    opacity: 0;
                    transform: translate3d(0, 0, 0) rotate(var(--meteor-angle));
                }
                8% {
                    opacity: 0.7;
                    transform: translate3d(var(--meteor-x08), var(--meteor-y08), 0) rotate(var(--meteor-angle));
                }
                20% {
                    opacity: 1;
                    transform: translate3d(var(--meteor-x20), var(--meteor-y20), 0) rotate(var(--meteor-angle));
                }
                36% {
                    opacity: 0.65;
                    transform: translate3d(var(--meteor-x36), var(--meteor-y36), 0) rotate(var(--meteor-angle));
                }
                53% {
                    opacity: 0;
                    transform: translate3d(var(--meteor-x53), var(--meteor-y53), 0) rotate(var(--meteor-angle));
                }
                100% {
                    opacity: 0;
                    transform: translate3d(var(--meteor-x100), var(--meteor-y100), 0) rotate(var(--meteor-angle));
                }
            }

            :root {
                --anh-cao: 88vh;
            }

            /* Ảnh hai cô gái áo dài (đã tách nền) ở góc phải */
            #anh-hai-nguoi {
                position: absolute;
                right: 2vw;
                bottom: 0;
                height: var(--anh-cao);
                max-width: 60vw;
                object-fit: contain;
                object-position: right bottom;
                z-index: 4;
                pointer-events: none;
                opacity: 0;
                transform: translateY(24px);
                transition:
                    opacity 3s ease-in-out 0.8s,
                    transform 3s ease-out 0.8s;
                filter: drop-shadow(0 0 2px rgba(110, 60, 0, 0.8)) drop-shadow(0 0 8px rgba(255, 200, 60, 0.5));
            }

            #anh-hai-nguoi.hien-thi {
                opacity: 1;
                transform: translateY(0);
            }

            /* Cỏ hoa tiền cảnh che gấu váy/chân; nét mảnh và vẫn đung đưa. */
            #co-hoa {
                position: absolute;
                left: 0;
                bottom: 0;
                z-index: 7;
                overflow: visible; /* Không cắt đầu bông hoa vượt khỏi mép trên của SVG */
                pointer-events: none;
                opacity: 0;
                transition: opacity 2s ease-in-out 0.6s;
                filter: drop-shadow(0 0 2px rgba(110, 60, 0, 0.8)) drop-shadow(0 0 8px rgba(255, 200, 60, 0.4));
            }

            #co-hoa.hien-thi {
                opacity: 1;
            }

            /* Gộp hàng trăm ngọn cỏ vào vài nét SVG: ít DOM / animation hơn. */
            #co-hoa .co-ngan {
                fill: none;
                stroke-width: 1.5;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            #co-hoa .net {
                fill: none;
                stroke: var(--mau, #ffffff);
                stroke-width: 1.5;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-dasharray: 1 1;
                stroke-dashoffset: 1;
            }

            #co-hoa.hien-thi .net {
                animation: veNet 3s ease-out forwards;
                animation-delay: var(--d, 0s);
            }

            #co-hoa.xong .net {
                animation: none;
                stroke-dashoffset: 0;
            }

            @keyframes veNet {
                to {
                    stroke-dashoffset: 0;
                }
            }

            #co-hoa .lac {
                animation: gio 3.4s ease-in-out infinite alternate;
            }

            @keyframes gio {
                from {
                    transform: rotate(calc(var(--a, 2deg) * -1));
                }
                to {
                    transform: rotate(var(--a, 2deg));
                }
            }

            /* Lá vàng và hoa rơi ở bên phải màn hình */

                position: absolute;

            .lower-star {

            /* CSS riêng cho điện thoại */
            @media screen and (max-width: 767px) {
                #text {
                    position: absolute;

                    left: 0;
                    width: 100%;

                    padding: 0 14px;

            #vang-overlay {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: linear-gradient(
                    to top,
                    rgba(255, 207, 83, 0.52) 0%,
                    rgba(255, 210, 93, 0.32) calc(var(--anh-cao) * 0.16),
                    rgba(255, 222, 132, 0.13) calc(var(--anh-cao) * 0.29),

                );

                transition: opacity 2s ease-in-out 0.6s;

            #vang-overlay.loe {
                animation: loeVang 3.5s ease-out forwards;
            }
            @keyframes loeVang {
                0% {
                    opacity: 0;

                }
                15% {
                    opacity: 1;

                }
                100% {
                    opacity: 1;
                    filter: brightness(1);
                }
            }

            /* Animation chữ bay lên xuống nhẹ nhàng */
            @keyframes chuLenXuong {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-5px);
                }
            }

            /* Hiệu ứng chữ xuất hiện */
            @keyframes chuHienLen {
                0% {
                    opacity: 0;
                    transform: translateY(10px);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Chữ chính */
            #text {
                animation: chuLenXuong 3s ease-in-out infinite;
                will-change: transform;
            }

            /* Các lớp chữ */
            .text-layer {
                animation: chuLenXuong 3s ease-in-out infinite;
                will-change: transform;
            }

            /* Khi chữ được hiển thị */
            .text-layer.hien-thi {
                opacity: 1;
                animation:
                    chuHienLen 0.8s ease-out,
                    chuLenXuong 3s ease-in-out 0.8s infinite;
            }

            /* Tạo độ lệch chuyển động giữa các dòng */
            #text .chu-20-10:nth-child(2) {
                animation-delay: 0.3s;
            }

            /* Giữ hiệu ứng nhẹ nhàng trên điện thoại */
            @media screen and (max-width: 767px) {
                #text {
                    animation: chuLenXuong 3.5s ease-in-out infinite;
                }

                .text-layer {
                    animation: chuLenXuong 3.5s ease-in-out infinite;
                }
            }

            /* Tôn trọng cài đặt giảm chuyển động của người dùng */
            @media (prefers-reduced-motion: reduce) {
                #text,
                .text-layer,
                .text-layer.hien-thi {
                    animation: none;
                    transition: opacity 0.3s ease;
                }
            }

/* PHONG BÌ */
.envelope-scene {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(68vw, 255px);
  height: 158px;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 3;
}

.opening.is-open .envelope-scene {
  opacity: 1;
}

.envelope {
  position: absolute;
  inset: 0;
  filter: drop-shadow(0 13px 12px rgba(93, 68, 55, 0.16));
}

.envelope-back {
  position: absolute;
  inset: 0;
  background: #dac0ac;
  border-radius: 3px;
}

.envelope-pocket {
  position: absolute;
  inset: 0;
  z-index: 3; /* Mặt trước túi phong bì nằm ở z-index: 3 */
  background: #ead5c3;
  clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
  pointer-events: none;
}

.envelope-flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 88px;
  z-index: 4;
  transform-origin: top center;
  background: #e3cbb7;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transition: transform 0.4s cubic-bezier(0.23, 0.7, 0.25, 1);
}

.opening.is-open .envelope-flap {
  transform: rotateX(180deg);
  z-index: 0;
}

/* THƯ PHÚT ĐẦU BẮN RA TỪ PHONG BÌ (GIAO ĐOẠN BAY LÊN) */
.envelope-sheet {
  position: absolute;
  width: 78%;
  height: 100px;
  bottom: 8px;
  left: 11%;
  background: #fffcf7;
  border: 1px solid #e8dbcf;
  border-radius: 6px;
  box-shadow: 0 4px 15px rgba(70, 50, 40, 0.12);
  z-index: 2; /* Nằm dưới túi phong bì (z-index: 3) */
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 12px;
  opacity: 0;
}

.envelope-sheet.shoot-out {
  z-index: 2; /* Đảm bảo khi bay lên vẫn giữ z-index: 2 để luôn ở phía sau mặt túi phong bì */
  animation: shootUpAndOut 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

@keyframes shootUpAndOut {
  0% {
    opacity: 0;
    transform: translateY(0) scale(0.8) rotate(0deg);
  }
  20% {
    opacity: 1;
    transform: translateY(-30px) scale(0.95) rotate(calc(var(--rot) * 0.3));
  }
  100% {
    opacity: 1;
    transform: translate(var(--shootX), -120vh) scale(1.15) rotate(var(--rot));
  }
}

/* TRẬN MƯA THƯ RƠI PHỦ KÍN MÀN HÌNH (GIAO ĐOẠN RƠI XUỐNG) */
#rain-sheets-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999; /* z-index cao giúp các lá thư khi rơi xuống sẽ nằm ĐÈ TRÊN phong bì */
  overflow: hidden;
}

.falling-sheet {
  position: absolute;
  width: 280px;
  height: 120px;
  background: #fffcf7;
  border: 1px solid #e8dbcf;
  border-radius: 8px;
  box-shadow: 0 10px 25px rgba(70, 50, 40, 0.18);
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 15px;
  line-height: 1.4;
  font-weight: 600;
  color: #59483f;
  opacity: 0;
  animation: dropIn var(--duration) cubic-bezier(0.25, 1, 0.5, 1) forwards;
  transition: opacity 3s ease-in-out;
}

@keyframes dropIn {
  0% {
    opacity: 0;
    transform: translateY(-120vh) rotate(var(--rotStart));
  }
  15% {
    opacity: 1;
  }
  100% {
    opacity: 1;
    transform: translateY(0) rotate(var(--rotEnd));
  }
}

.falling-sheet.fade-out {
  animation: fadeOutSheet 1s ease-in-out forwards !important;
}

@keyframes fadeOutSheet {
  0% {
    opacity: 1;
    transform: translateY(0) rotate(var(--rotEnd));
  }
  100% {
    opacity: 0;
    transform: translateY(0) rotate(var(--rotEnd));
  }
}

/* Responsive cho điện thoại */
@media (max-width: 600px) {
  .falling-sheet {
    width: 160px;
    height: 90px;
    padding: 8px;
    font-size: 12px;
    line-height: 1.35;
    border-radius: 6px;
  }
}
/* Khung chứa hiệu ứng nền toàn màn hình */
.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

/* Hiệu ứng các đám mây/quầng sáng mờ (thẻ <i>) */
.ambient > i {
  position: absolute;
  border-radius: 50%;
  filter: blur(50px);
  width: 55vmax;
  height: 55vmax;
  opacity: 0.26;
  animation: cloud-drift 18s ease-in-out infinite alternate;
}

.ambient > i:nth-child(1) {
  top: -25vmax;
  right: -15vmax;
  background: #f5b7d1;
}

.ambient > i:nth-child(2) {
  bottom: -25vmax;
  left: -23vmax;
  background: #edcbdc;
  animation-delay: -8s;
}

.ambient > i:nth-child(3) {
  left: 50%;
  top: 25%;
  height: 25vmax;
  width: 25vmax;
  background: #fffef3;
  opacity: 0.7;
  animation-delay: -14s;
}

/* Hiệu ứng các ngôi sao/biểu tượng bay lơ lửng (thẻ <span class="ambient-star">) */
.ambient-star {
  position: absolute;
  color: #cc879d;
  opacity: 0.44;
  animation: float-gentle 7s ease-in-out infinite;
  font-family: Georgia, serif;
}

.a1 {
  left: 10%;
  top: 20%;
  font-size: 24px;
}

.a2 {
  right: 14%;
  top: 38%;
  font-size: 14px;
  animation-delay: -2s;
}

.a3 {
  left: 7%;
  top: 68%;
  font-size: 34px;
  transform: rotate(-18deg);
}

.a4 {
  right: 8%;
  bottom: 12%;
  font-size: 30px;
  animation-delay: -5s;
}

.a5 {
  left: 55%;
  top: 12%;
  font-size: 13px;
  opacity: 0.25;
}

/* Keyframes cho chuyển động trôi đám mây và nhấp nhô nhẹ */
@keyframes cloud-drift {
  to {
    transform: translate(10%, 12%) scale(1.13);
  }
}

@keyframes float-gentle {
  50% {
    translate: 0 -10px;
    rotate: 3deg;
  }
}

/* Biến đổi họa tiết nền theo ngữ cảnh trang (nếu có sử dụng data-scene) */
body[data-scene="wishes"] .ambient > i {
  opacity: 0.1;
}

body[data-scene="profile"] .ambient {

body[data-scene="quiz"] .ambient {

}

body[data-scene="puzzle"] .ambient {

  background-size: 17px 17px;
}

body[data-scene="letter"] .ambient {
  background-image: repeating-linear-gradient(0deg, transparent 0 38px, #ddbeca10 38px 39px);
}

body[data-scene="ending"] .ambient:after {
  content: "♡";
  position: absolute;
  left: 50%;
  top: 35%;
  translate: -50% -50%;

  color: #f0c4d133;

}

@keyframes ending-bg-heart {

    scale: 1.05;
    rotate: 4deg;
  }
}

/* Tối ưu khi thiết bị bật chế độ giảm chuyển động */
@media (prefers-reduced-motion: reduce) {
  .ambient > i {

}

        <script>
const textLayer = document.getElementById('text');

let originalHTML = '';

function buildLetters() {
    if (!textLayer || textLayer.dataset.built) return;

    originalHTML = textLayer.innerHTML;
    textLayer.dataset.built = 'true';

    // Giữ nguyên cấu trúc hai đoạn và các thẻ <br>
    textLayer.querySelectorAll('.chu-20-10').forEach(span => {
        const walker = document.createTreeWalker(
            span,
            NodeFilter.SHOW_TEXT
        );

        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);

        nodes.forEach(node => {
            const fragment = document.createDocumentFragment();

            for (const char of node.textContent) {
                if (char === '\n' || char === '\r') {
                    fragment.appendChild(document.createTextNode(char));
                    continue;
                }

                const letter = document.createElement('span');
                letter.className = 'decode-char';
                letter.textContent = char === ' ' ? '\u00a0' : char;

                const dx = (Math.random() - 0.5) *
                    Math.min(window.innerWidth * 0.7, 480);
                const dy = (Math.random() - 0.5) * 180;
                const rot = (Math.random() - 0.5) * 150;

                letter.style.opacity = '0.5';
                letter.style.transform =
                    `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;

                fragment.appendChild(letter);
            }

            node.replaceWith(fragment);
        });
    });
}
buildLetters();
            window.FX.init();

            // Các ngôi sao nhấp nháy và sao băng bay lặp lại trên nền trời.
            (() => {
                const sky = document.getElementById("tiny-sky");
                for (let i = 0; i < (TINY_PERF.mobile ? 30 : TINY_PERF.lite ? 58 : 78); i++) {
                    const star = document.createElement("span");
                    star.className = "tiny-star";
                    star.style.left = Math.random() * 100 + "%";
                    star.style.top = Math.random() * 75 + "%";
                    star.style.setProperty("--size", 1 + Math.random() * 2 + "px");
                    star.style.setProperty("--twinkle", 1.4 + Math.random() * 3.2 + "s");
                    star.style.setProperty("--delay", -Math.random() * 5 + "s");
                    sky.appendChild(star);
                }
                const lower = document.getElementById("lower-stars");
                for (let i = 0; i < (TINY_PERF.mobile ? 12 : 28); i++) {
                    const star = document.createElement("span");
                    star.className = "lower-star";
                    star.style.left = Math.random() * 100 + "%";
                    star.style.top = 76 + Math.random() * 20 + "%";
                    star.style.setProperty("--size", 1 + Math.random() * 2.4 + "px");
                    star.style.setProperty("--twinkle", 1.5 + Math.random() * 3 + "s");
                    star.style.setProperty("--delay", -Math.random() * 5 + "s");
                    lower.appendChild(star);
                }
                // Không tạo sao từ lớp vũ trụ cũ nữa: từ lời chúc sức khỏe đã thay bằng
                // Uiverse #stars, #stars2, #stars3, tránh tốn thêm 90–170 animation.

                // Sao băng thay vị trí và góc lao sau MỖI lượt, không chỉ ngẫu nhiên lúc tải trang.
                const meteors = [];
                function quyDaoSao(meteor) {
                    const w = window.innerWidth,
                        h = window.innerHeight;
                    const dx = w * Number(meteor.dataset.flyX),
                        dy = h * Number(meteor.dataset.flyY);
                    const goc = (Math.atan2(-dy, dx) * 180) / Math.PI;
                    meteor.style.setProperty("--meteor-angle", goc.toFixed(1) + "deg");
                    for (const t of [8, 20, 36, 53, 100]) {
                        meteor.style.setProperty(
                            "--meteor-x" + String(t).padStart(2, "0"),
                            ((-dx * t) / 100).toFixed(1) + "px"
                        );
                        meteor.style.setProperty(
                            "--meteor-y" + String(t).padStart(2, "0"),
                            ((dy * t) / 100).toFixed(1) + "px"
                        );
                    }
                }
                function datSaoNgauNhien(meteor) {
                    // Phân bố cả nửa trên và vùng giữa trời, chừa lề tránh cắt đầu sao.
                    const x = 23 + Math.random() * 63; // 23%-86% chiều rộng màn hình
                    const y = 7 + Math.random() * 46; // 7%-53% chiều cao màn hình
                    meteor.style.left = x.toFixed(2) + "%";
                    meteor.style.top = y.toFixed(2) + "%";
                    meteor.dataset.flyX = String(Math.min(0.14 + Math.random() * 0.13, x / 100 - 0.07));
                    meteor.dataset.flyY = String(0.1 + Math.random() * 0.12);
                    quyDaoSao(meteor);
                }
                for (let i = 0; i < 4; i++) {
                    const meteor = document.createElement("span");
                    meteor.className = "tiny-meteor";
                    meteor.style.setProperty("--period", 6.1 + Math.random() * 1.4 + "s");
                    meteor.style.setProperty("--meteor-delay", -i * 1.65 + "s");
                    datSaoNgauNhien(meteor);
                    // Chuyển vị trí ở ranh giới hai vòng khi sao đang vô hình, tránh nhảy hình.
                    meteor.addEventListener("animationiteration", () => datSaoNgauNhien(meteor));
                    sky.appendChild(meteor);
                    meteors.push(meteor);
                }
                let resizeSao;
                window.addEventListener("resize", () => {
                    clearTimeout(resizeSao);
                    resizeSao = setTimeout(() => meteors.forEach(quyDaoSao), 200);
                });
            })();
        </script>
