  <script id="tiny-performance-profile">
  /* Performance profile: animated background adapts, story timing/audio/product links stay unchanged. */
    window.TINY_PERF = (() => {
      const qs = new URLSearchParams(location.search);
      const quality = qs.get('tinyfx');
      const touch = matchMedia('(pointer:coarse)').matches;
      const constrained = touch || (navigator.deviceMemory && navigator.deviceMemory <= 6)
         || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
      const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (touch && matchMedia('(max-width:900px)').matches && !/Windows|Macintosh|X11/i.test(navigator.userAgent));
      const lite = mobile || (quality === 'full' ? false : quality === 'lite' ? true : !!constrained);
      document.documentElement.classList.toggle('tiny-lite', lite);
      document.documentElement.classList.toggle('tiny-mobile', mobile);
      const maxCanvasPixels = mobile ? 365000 : lite ? 1250000 : 2100000;
      function canvasDpr(w,h,maxDpr=1.6) {
        return Math.max(mobile ? .48 : .55, Math.min(devicePixelRatio || 1,
          mobile ? .84 : lite ? 1.15 : maxDpr,
          Math.sqrt(maxCanvasPixels / Math.max(1, w*h))));
      }
      return { lite, mobile, canvasDpr, ambientFps: mobile ? 60 : lite ? 24 : 60,
        roverFps:mobile ? 45 : lite ? 30 : 60,
        orbitFps:mobile ? 45 : lite ? 24 : 60,
        leafFps:mobile ? 60 : lite ? 24 : 60 };

    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
            background-color: #000000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            font-family: 'Courier Prime', monospace;
            position: relative;
        }

    /* Background & Canvas Elements */
    #universeCanvas, #flowerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #universeCanvas {
      z-index: 1;
    }

    #flowerCanvas {
      z-index: 2;
    }

    /* Scene Layout */
    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .scene.active {
      pointer-events: auto;
    }

    /* Intro Center Object */
    .intro-object {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .intro-object.bursting {
      transform: scale(1.5);
      opacity: 1;
    }

    .intro-object.hidden, .s1-intro-hint.hidden, .s1-tap-hint.hidden {
      display: none !important;
    }

    .rose-icon-btn {
      font-size: 80px;
      animation: pulseHeart 1.8s infinite ease-in-out;
      filter: drop-shadow(0 0 15px rgba(255, 77, 121, 0.6));
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Hints & Text Overlay */
    
.s1-intro-hint,
.s1-tap-hint {
    position: absolute;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    box-sizing: border-box;
    padding: 0 12px;
    z-index: 10;
    text-align: center;
    pointer-events: none;
}

.intro-hint-text,
.tap-hint-text {
    display: inline-block;
    max-width: 100%;
    box-sizing: border-box;

    font-family: 'Dancing Script', cursive;
    font-size: clamp(1rem, 5vw, 2rem);
    font-weight: normal;
    line-height: 1.4;
    color: #fff;

    text-shadow:
        0 0 10px #ff3366,
        0 0 20px #ff3366;

    letter-spacing: 1px;
    overflow-wrap: break-word;
    animation: fadeInOut 2s infinite ease-in-out;
}

/* Chỉ áp dụng trên điện thoại */
@media screen and (max-width: 767px) {
    .s1-intro-hint,
    .s1-tap-hint {
        bottom: 10%;
        padding: 0 16px;
    }

    .intro-hint-text,
    .tap-hint-text {
        font-size: clamp(16px, 5vw, 22px);
        letter-spacing: 0.5px;
        line-height: 1.5;
        text-shadow:
            0 0 6px #ff3366,
            0 0 12px #ff3366;
    }
}

/* Điện thoại màn hình nhỏ */
@media screen and (max-width: 360px) {
    .intro-hint-text,
    .tap-hint-text {
        font-size: 16px;
        letter-spacing: 0;
    }
}


    @keyframes fadeInOut {
      0%, 100% { opacity: 1.4; }
      50% { opacity: 1; }
    }

      top: 20px;
      right: 20px;

      animation: spin 4s linear infinite;
      background: rgba(255, 51, 102, 0.4);
      border-color: #ff4d79;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }

    body {
            background-color: #000000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            font-family: 'Courier Prime', monospace;
            position: relative;
        }


        /* Bầu trời sao (lớp nền, không che nhân vật và chữ) */
        #tiny-sky {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.6s ease-in-out, visibility 1.6s;
        }
        #tiny-sky.hien-thi {
            opacity: 1;
            visibility: visible;
        }
        #tiny-sky:not(.hien-thi) .tiny-star,
        #tiny-sky:not(.hien-thi) .tiny-meteor {
            animation-play-state: paused;
        }
        .tiny-star {
            position: absolute;
            width: var(--size);
            height: var(--size);
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px 1px rgba(220, 244, 255, .65);
            animation: tinyTwinkle var(--twinkle) ease-in-out var(--delay) infinite alternate;
        }
        @keyframes tinyTwinkle {
            from { opacity: .18; transform: scale(.65); }
            to { opacity: .95; transform: scale(1.25); }
        }
        /* Sao băng: đuôi kéo về phía trên-phải, đầu sao lao chéo xuống-trái.
           Góc nghiêng được JS căn trùng với quỹ đạo thực tế ở từng màn hình. */
        .tiny-meteor {
            position: absolute;
            width: clamp(62px, 10vw, 135px);
            height: 2px;
            opacity: 0;
            background: linear-gradient(to right,
                rgba(255,255,255,.98) 0%,
                rgba(198,235,255,.86) 13%,
                rgba(130,200,255,.34) 52%,
                rgba(130,200,255,0) 100%);
            border-radius: 99px;
            box-shadow: 0 0 6px rgba(210,240,255,.70);
            transform-origin: 0 50%;
            transform: translate3d(0,0,0) rotate(var(--meteor-angle, -25deg));
            will-change: transform, opacity;
            animation: tinyMeteor var(--period) linear var(--meteor-delay) infinite;
        }
        .tiny-meteor::before {
            content: '';
            position: absolute;
            left: -3px;
            top: -2.5px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px 2px rgba(230,249,255,.90);
        }
        /* Tất cả diễn ra đồng thời: nổi sáng -> lao dọc một đường thẳng -> chìm dần.
           Nửa sau chu kỳ ẩn để các sao băng không xuất hiện dồn dập. */
        @keyframes tinyMeteor {
            0%   { opacity: 0;   transform: translate3d(0,0,0) rotate(var(--meteor-angle)); }
            8%   { opacity: .70; transform: translate3d(var(--meteor-x08),var(--meteor-y08),0) rotate(var(--meteor-angle)); }
            20%  { opacity: 1;   transform: translate3d(var(--meteor-x20),var(--meteor-y20),0) rotate(var(--meteor-angle)); }
            36%  { opacity: .65; transform: translate3d(var(--meteor-x36),var(--meteor-y36),0) rotate(var(--meteor-angle)); }
            53%  { opacity: 0;   transform: translate3d(var(--meteor-x53),var(--meteor-y53),0) rotate(var(--meteor-angle)); }
            100% { opacity: 0;   transform: translate3d(var(--meteor-x100),var(--meteor-y100),0) rotate(var(--meteor-angle)); }
        }

        :root { --anh-cao: 88vh; }

        /* Ảnh hai cô gái áo dài (đã tách nền) ở góc phải */
        #anh-hai-nguoi {
            position: absolute;
            right: 2vw;
            bottom: 0;
            height: var(--anh-cao);
            max-width: 60vw;
            object-fit: contain;
            object-position: right bottom;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 3s ease-in-out 0.8s, transform 3s ease-out 0.8s;
            filter: drop-shadow(0 0 2px rgba(110, 60, 0, 0.8)) drop-shadow(0 0 8px rgba(255, 200, 60, 0.5));
        }

        #anh-hai-nguoi.hien-thi {
            opacity: 1;
            transform: translateY(0);
        }

        /* Cỏ hoa tiền cảnh che gấu váy/chân; nét mảnh và vẫn đung đưa. */
        #co-hoa {
            position: absolute;
            left: 0; bottom: 0;
            z-index: 7;
            overflow: visible; /* Không cắt đầu bông hoa vượt khỏi mép trên của SVG */
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease-in-out 0.6s;
            filter: drop-shadow(0 0 2px rgba(110, 60, 0, 0.8)) drop-shadow(0 0 8px rgba(255, 200, 60, 0.4));
        }

        #co-hoa.hien-thi {
            opacity: 1;
        }

        /* Gộp hàng trăm ngọn cỏ vào vài nét SVG: ít DOM / animation hơn. */
        #co-hoa .co-ngan {
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #co-hoa .net {
            fill: none;
            stroke: var(--mau, #ffffff);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1 1;
            stroke-dashoffset: 1;
        }

        #co-hoa.hien-thi .net {
            animation: veNet 3s ease-out forwards;
            animation-delay: var(--d, 0s);
        }

        #co-hoa.xong .net {
            animation: none;
            stroke-dashoffset: 0;
        }

        @keyframes veNet {
            to { stroke-dashoffset: 0; }
        }

        #co-hoa .lac {
            animation: gio 3.4s ease-in-out infinite alternate;
        }

        @keyframes gio {
            from { transform: rotate(calc(var(--a, 2deg) * -1)); }
            to   { transform: rotate(var(--a, 2deg)); }
        }

        /* Lá vàng và hoa rơi ở bên phải màn hình */
        #laCanvas {
            position: absolute;
            top: 0; right: 0;
            width: 50vw;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 30%);
            mask-image: linear-gradient(to right, transparent 0%, #000 30%);
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        #laCanvas.hien-thi {
            opacity: 1;
        }

        #natureCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        #natureCanvas.hien-thi {
            opacity: 1;
        }
#lower-stars {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity .9s ease-in-out;
        }
        #lower-stars.hien-thi { opacity: 1; }
        #lower-stars:not(.hien-thi) .lower-star { animation-play-state: paused; }
        .lower-star {
            position: absolute;
            width: var(--size);
            height: var(--size);
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 7px 1px rgba(220,244,255,.68);
            animation: tinyTwinkle var(--twinkle) ease-in-out var(--delay) infinite alternate;
        }
      #text { top: 10%; left: 0; width: 66%; font-size: 2.4rem; color: #ffb6c1; text-shadow: 0 0 15px #ff69b4; line-height: 1.35; }
      .text-layer {
            color: #ffffff;
            letter-spacing: 4px;
            position: absolute;
            width: 100%;
            text-align: center;
            opacity: 0;
            transition: opacity 0.7s ease-in-out;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(0, 255, 255, 0.6);
            pointer-events: none;
            z-index: 10;
        }
        .text-layer.hien-thi {
            opacity: 1;
        }
        #text .chu-20-10 { display: block; }
        #text .chu-20-10:last-child { margin-top: .08em; }

@media screen and (max-width: 767px) {

        #vang-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top,
                rgba(255, 207, 83, .52) 0%,

            opacity: 0;

        #vang-overlay.loe {

        @keyframes loeVang {
            0%   { opacity: 0; filter: brightness(1); }

        }

  </style>

  <script>
        // Các ngôi sao nhấp nháy và sao băng bay lặp lại trên nền trời.
        (() => {
            const sky = document.getElementById('tiny-sky');
            for (let i = 0; i < (TINY_PERF.mobile ? 30 : TINY_PERF.lite ? 58 : 78); i++) {
                const star = document.createElement('span');
                star.className = 'tiny-star';
                star.style.left = (Math.random() * 100) + '%';
                star.style.top = (Math.random() * 75) + '%';
                star.style.setProperty('--size', (1 + Math.random() * 2) + 'px');
                star.style.setProperty('--twinkle', (1.4 + Math.random() * 3.2) + 's');
                star.style.setProperty('--delay', (-Math.random() * 5) + 's');
                sky.appendChild(star);
            }
            const lower = document.getElementById('lower-stars');
            for (let i = 0; i < (TINY_PERF.mobile ? 12 : 28); i++) {
                const star = document.createElement('span');
                star.className = 'lower-star';
                star.style.left = (Math.random() * 100) + '%';
                star.style.top = (76 + Math.random() * 20) + '%';
                star.style.setProperty('--size', (1 + Math.random() * 2.4) + 'px');
                star.style.setProperty('--twinkle', (1.5 + Math.random() * 3) + 's');
                star.style.setProperty('--delay', (-Math.random() * 5) + 's');
                lower.appendChild(star);
            }
            // Không tạo sao từ lớp vũ trụ cũ nữa: từ lời chúc sức khỏe đã thay bằng
            // Uiverse #stars, #stars2, #stars3, tránh tốn thêm 90–170 animation.

            // Sao băng thay vị trí và góc lao sau MỖI lượt, không chỉ ngẫu nhiên lúc tải trang.
            const meteors = [];
            function quyDaoSao(meteor) {
                const w = window.innerWidth, h = window.innerHeight;
                const dx = w * Number(meteor.dataset.flyX), dy = h * Number(meteor.dataset.flyY);
                const goc = Math.atan2(-dy, dx) * 180 / Math.PI;
                meteor.style.setProperty('--meteor-angle', goc.toFixed(1) + 'deg');
                for (const t of [8, 20, 36, 53, 100]) {
                    meteor.style.setProperty('--meteor-x' + String(t).padStart(2, '0'), (-dx * t / 100).toFixed(1) + 'px');
                    meteor.style.setProperty('--meteor-y' + String(t).padStart(2, '0'), (dy * t / 100).toFixed(1) + 'px');
                }
            }
            function datSaoNgauNhien(meteor) {
                // Phân bố cả nửa trên và vùng giữa trời, chừa lề tránh cắt đầu sao.
                const x = 23 + Math.random() * 63;   // 23%-86% chiều rộng màn hình
                const y = 7 + Math.random() * 46;    // 7%-53% chiều cao màn hình
                meteor.style.left = x.toFixed(2) + '%';
                meteor.style.top = y.toFixed(2) + '%';
                meteor.dataset.flyX = String(Math.min(.14 + Math.random() * .13, x / 100 - .07));
                meteor.dataset.flyY = String(.10 + Math.random() * .12);
                quyDaoSao(meteor);
            }
            for (let i = 0; i < 4; i++) {
                const meteor = document.createElement('span');
                meteor.className = 'tiny-meteor';
                meteor.style.setProperty('--period', (6.1 + Math.random() * 1.4) + 's');
                meteor.style.setProperty('--meteor-delay', (-i * 1.65) + 's');
                datSaoNgauNhien(meteor);
                // Chuyển vị trí ở ranh giới hai vòng khi sao đang vô hình, tránh nhảy hình.
                meteor.addEventListener('animationiteration', () => datSaoNgauNhien(meteor));
                sky.appendChild(meteor);
                meteors.push(meteor);
            }
            let resizeSao;
            window.addEventListener('resize', () => {
                clearTimeout(resizeSao);
                resizeSao = setTimeout(() => meteors.forEach(quyDaoSao), 200);
            });

        })();
    </script>
